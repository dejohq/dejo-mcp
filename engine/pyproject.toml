[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dejo"
version = "0.3.0"
description = "A browser memory for AI agents: learn a site once, replay the trail with no model calls."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
authors = [{ name = "Rohit Kashyap" }]
dependencies = [
    "playwright>=1.62.0",
]

[project.optional-dependencies]
# Memory is Dejo's own SQLite file and needs nothing installed. Sibyl Memory is an optional
# second backend, chosen with DEJO_MEMORY=sibyl.
sibyl = ["sibyl-memory-client>=0.8.0"]
# The Sibyl backend is in dev so its tests run everywhere the rest do. Held below 0.9 here only:
# the tests write sample Sibyl files the way Cairn-era Sibyl did, and 0.9.0 refuses to write
# anything until `sibyl init` has made an account, which a CI machine never has. Dejo's own
# import of an old Sibyl file reads it directly and needs no Sibyl package at all.
dev = ["pytest>=8.0", "fastapi>=0.141.1", "uvicorn>=0.52.4", "sibyl-memory-client>=0.8.0,<0.9"]

[project.urls]
Homepage = "https://dejo.run"
Repository = "https://github.com/dejohq/dejo-mcp"
Issues = "https://github.com/dejohq/dejo-mcp/issues"

[project.scripts]
dejo = "dejo.cli:console"

[tool.hatch.build.targets.wheel]
packages = ["src/dejo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# BLE catches `except Exception`. It is here because that exact shape has already
# caused two incidents in this project: a silent sign-out, and an error that blamed
# the browser profile for every possible failure. Where a blind catch is genuinely
# right, mark it `# noqa: BLE001` with the reason.
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
