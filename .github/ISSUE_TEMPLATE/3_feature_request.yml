name: Feature request
description: Something Dejo should do that it does not do yet.
title: "Idea: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and where does Dejo get in the way or fall short?
      placeholder: "Every Monday my agent downloads three invoices from the same portal, and ..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture it working. A rough idea is fine.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Any workaround you use now, if there is one.
