[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dejo-mcp"
version = "0.3.0"
description = "Dejo as MCP tools: a browser with a memory, for Claude Code, Cursor and Codex."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
authors = [{ name = "Rohit Kashyap" }]
dependencies = [
    # A FLOOR, not decoration, and it has to move every time this server starts using
    # something new in the engine. Left too low, pip is free to pair this server with an
    # older engine and the import fails outright: the server never starts at all, which is
    # the worst shape of failure there is.
    "dejo>=0.3.0",
    # Capped at <2 deliberately, and it is not cosmetic: mcp 2.x renamed and changed the
    # server APIs, and an import that fails means the server never starts. Found once by
    # installing the built wheels into a clean virtualenv, 2026-09-04. The floor is the
    # version the low-level `Server` (hand-written tools with `_meta` and annotations,
    # `call_tool(validate_input=...)`) was tested on. Moving to 2.x is planned work.
    "mcp>=1.30.0,<3",
    # Imported directly to run each tool call off the event loop. It also arrives with
    # `mcp`, but a package should never lean on a dependency of a dependency.
    "anyio>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://dejo.run"
Repository = "https://github.com/dejohq/dejo-mcp"
Issues = "https://github.com/dejohq/dejo-mcp/issues"

[project.scripts]
dejo-mcp = "dejo_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dejo_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# BLE catches `except Exception`. It is here because that exact shape has already
# caused two incidents in this project: a silent sign-out, and an error that blamed
# the browser profile for every possible failure. Where a blind catch is genuinely
# right, mark it `# noqa: BLE001` with the reason.
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
